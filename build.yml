name: Build NK Top Status

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1

      - name: Build rootless package
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Show packages
        run: ls -lah packages || true

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: NKTopStatus-rootless
          path: packages/*.deb
          if-no-files-found: error
